# Loaded by nginx.conf inside the http context via conf.d/*.conf.
# Only authentication and registration endpoints receive non-empty keys.
map $uri $login_limit_key {
    default "";
    ~*^/api/(login/(options|verify)|auth/supabase)/?$ $binary_remote_addr;
}

map $uri $register_limit_key {
    default "";
    ~*^/api/register/(options|verify)/?$ $binary_remote_addr;
}

limit_req_zone $login_limit_key zone=login:10m rate=10r/m;
limit_req_zone $register_limit_key zone=register:10m rate=4r/m;
